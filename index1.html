<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:15px;
}

.gallery img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}

.gallery img:hover{
    transform:scale(1.03);
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal img{
    max-width:95%;
    max-height:95%;
    object-fit:contain;
}

.close{
    position:absolute;
    top:15px;
    right:30px;
    color:white;
    font-size:40px;
    cursor:pointer;
}

.loading{
    text-align:center;
    padding:30px;
    font-size:20px;
}

.error{
    color:red;
    text-align:center;
}

</style>
</head>
<body>

<h1>Galeria</h1>

<div id="loading" class="loading">
Ładowanie zdjęć...
</div>

<div id="gallery" class="gallery"></div>

<div id="modal" class="modal">
    <span class="close">&times;</span>
    <img id="fullImage">
</div>

<script>

const USER = "dariuszt007";
const REPO = "aoyamadai";
const BRANCH = "main";

const API =
`https://api.github.com/repos/${USER}/${REPO}/contents/images`;

const gallery = document.getElementById("gallery");
const loading = document.getElementById("loading");

fetch(API)

.then(response => {

    if(!response.ok){
        throw new Error("GitHub API error");
    }

    return response.json();
})

.then(files => {

    loading.style.display = "none";

    const imageExtensions = [
        ".png",
        ".jpg",
        ".jpeg",
        ".gif",
        ".webp",
        ".bmp",
        ".svg",
        ".avif"
    ];

    let count = 0;

    files.forEach(file => {

        const name = file.name.toLowerCase();

        const isImage =
            imageExtensions.some(ext =>
            name.endsWith(ext));

        if(!isImage) return;

        count++;

        const img = document.createElement("img");

        img.src =
        `https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/images/${file.name}`;

        img.loading = "lazy";

        img.onclick = () => {

            document.getElementById("modal").style.display = "flex";

            document.getElementById("fullImage").src =
            img.src;

        };

        gallery.appendChild(img);

    });

    if(count === 0){

        gallery.innerHTML =
        "<p>Brak zdjęć w folderze images</p>";

    }

})

.catch(error => {

    loading.className = "error";

    loading.innerHTML =
    "Nie można odczytać folderu images.<br><br>" +
    "Sprawdź czy repo jest PUBLIC oraz czy istnieje folder images.";

    console.error(error);

});

document.querySelector(".close").onclick = () => {

    document.getElementById("modal").style.display = "none";

};

document.getElementById("modal").onclick = function(e){

    if(e.target === this){

        this.style.display = "none";

    }

};

document.addEventListener("contextmenu",
e => e.preventDefault());

document.addEventListener("dragstart",
e => e.preventDefault());

document.addEventListener("selectstart",
e => e.preventDefault());

</script>

</body>
</html>
