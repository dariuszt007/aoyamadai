<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:15px;
}

.gallery img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
    user-select:none;
}

.gallery img:hover{
    transform:scale(1.03);
}

.loading{
    text-align:center;
    padding:30px;
    font-size:20px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    justify-content:center;
    align-items:center;
    overflow:hidden;
    z-index:99999;
}

.viewer{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

#fullImage{
    max-width:none;
    max-height:none;
    cursor:grab;
    transform-origin:center center;
}

.toolbar{
    position:absolute;
    top:15px;
    left:15px;
    z-index:100000;
    display:flex;
    gap:8px;
    align-items:center;
}

.toolbar button{
    background:#222;
    border:1px solid #666;
    color:white;
    padding:10px 15px;
    cursor:pointer;
    border-radius:6px;
    font-size:16px;
}

.toolbar button:hover{
    background:#444;
}

#zoomLevel{
    font-size:18px;
    min-width:80px;
}

.close{
    position:absolute;
    top:10px;
    right:25px;
    font-size:40px;
    color:white;
    cursor:pointer;
    z-index:100001;
}

.error{
    text-align:center;
    color:red;
    padding:30px;
}

</style>
</head>
<body>

<h1>Galeria</h1>

<div id="loading" class="loading">
Ładowanie zdjęć...
</div>

<div id="gallery" class="gallery"></div>

<div id="modal" class="modal">

    <span class="close">&times;</span>

    <div class="toolbar">
        <button onclick="zoomOut()">−</button>
        <button onclick="resetZoom()">100%</button>
        <button onclick="zoomIn()">+</button>
        <span id="zoomLevel">100%</span>
    </div>

    <div class="viewer">
        <img id="fullImage">
    </div>

</div>

<script>

const USER = "dariuszt007";
const REPO = "aoyamadai";
const BRANCH = "main";

const API =
`https://api.github.com/repos/${USER}/${REPO}/contents/images`;

const gallery = document.getElementById("gallery");
const loading = document.getElementById("loading");

const supported = [
".png",
".jpg",
".jpeg",
".gif",
".webp",
".bmp",
".svg",
".avif"
];

fetch(API)
.then(res => {

    if(!res.ok){
        throw new Error("API ERROR");
    }

    return res.json();
})
.then(files => {

    loading.style.display="none";

    let count = 0;

    files.forEach(file=>{

        const lower =
        file.name.toLowerCase();

        const isImage =
        supported.some(ext =>
        lower.endsWith(ext));

        if(!isImage) return;

        count++;

        const img =
        document.createElement("img");

        img.src =
        `https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/images/${file.name}`;

        img.loading = "lazy";

        img.onclick = ()=>{

            document
            .getElementById("modal")
            .style.display = "flex";

            fullImage.src = img.src;

            resetZoom();
        };

        gallery.appendChild(img);

    });

    if(count===0){

        gallery.innerHTML=
        "<h3>Brak zdjęć w folderze images</h3>";

    }

})
.catch(err=>{

    console.error(err);

    loading.className="error";

    loading.innerHTML=
    "Nie można odczytać folderu images.";

});

const modal =
document.getElementById("modal");

const fullImage =
document.getElementById("fullImage");

document.querySelector(".close")
.onclick = () => {

    modal.style.display="none";

};

modal.addEventListener("click", function(e){

    if(e.target === modal){

        modal.style.display="none";

    }

});

let zoom = 1;
let posX = 0;
let posY = 0;

function updateTransform(){

    fullImage.style.transform =
    `translate(${posX}px,${posY}px) scale(${zoom})`;

    document.getElementById("zoomLevel")
    .textContent =
    Math.round(zoom*100)+"%";
}

function zoomIn(){

    zoom += 0.25;

    if(zoom > 10)
        zoom = 10;

    updateTransform();
}

function zoomOut(){

    zoom -= 0.25;

    if(zoom < 0.25)
        zoom = 0.25;

    updateTransform();
}

function resetZoom(){

    zoom = 1;
    posX = 0;
    posY = 0;

    updateTransform();
}

fullImage.addEventListener("wheel", function(e){

    e.preventDefault();

    if(e.deltaY < 0){

        zoom += 0.1;

    }else{

        zoom -= 0.1;

    }

    if(zoom < 0.25)
        zoom = 0.25;

    if(zoom > 10)
        zoom = 10;

    updateTransform();

});

let dragging = false;
let startX = 0;
let startY = 0;

fullImage.addEventListener("mousedown", e=>{

    dragging = true;

    startX = e.clientX - posX;
    startY = e.clientY - posY;

    fullImage.style.cursor="grabbing";

});

document.addEventListener("mousemove", e=>{

    if(!dragging) return;

    posX = e.clientX - startX;
    posY = e.clientY - startY;

    updateTransform();

});

document.addEventListener("mouseup", ()=>{

    dragging = false;

    fullImage.style.cursor="grab";

});

document.addEventListener("contextmenu",
e=>e.preventDefault());

document.addEventListener("dragstart",
e=>e.preventDefault());

document.addEventListener("selectstart",
e=>e.preventDefault());

</script>

</body>
</html>
