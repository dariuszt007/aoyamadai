<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:15px;
}

.gallery img{
    width:100%;
    height:250px;
    object-fit:cover;
    cursor:pointer;
    border-radius:10px;
    transition:.3s;
}

.gallery img:hover{
    transform:scale(1.03);
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modal img{
    max-width:95%;
    max-height:95%;
}

.close{
    position:absolute;
    top:20px;
    right:30px;
    font-size:40px;
    color:white;
    cursor:pointer;
}

.loading{
    text-align:center;
    padding:40px;
}
</style>
</head>
<body>

<h1>Galeria Zdjęć</h1>

<div class="loading" id="loading">
Ładowanie zdjęć...
</div>

<div class="gallery" id="gallery"></div>

<div class="modal" id="modal">
    <span class="close">&times;</span>
    <img id="fullImage">
</div>

<script>

const USER = "TWOJ_LOGIN";
const REPO = "TWOJE_REPO";
const BRANCH = "main";

const api =
`https://api.github.com/repos/${USER}/${REPO}/contents/images`;

const gallery = document.getElementById("gallery");
const loading = document.getElementById("loading");

fetch(api)
.then(res => res.json())
.then(files => {

    loading.style.display = "none";

    const imageExtensions = [
        ".png",
        ".jpg",
        ".jpeg",
        ".gif",
        ".webp",
        ".svg",
        ".bmp",
        ".avif"
    ];

    files.forEach(file => {

        const lower = file.name.toLowerCase();

        const isImage = imageExtensions.some(ext =>
            lower.endsWith(ext)
        );

        if(!isImage) return;

        const img = document.createElement("img");

        img.src =
        `https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/images/${file.name}`;

        img.alt = file.name;

        img.addEventListener("click", () => {

            document.getElementById("modal").style.display = "flex";
            document.getElementById("fullImage").src = img.src;

        });

        gallery.appendChild(img);

    });

})
.catch(error => {

    loading.innerHTML =
    "Błąd podczas pobierania zdjęć.";

    console.error(error);

});

document.querySelector(".close")
.addEventListener("click", () => {

    document.getElementById("modal").style.display = "none";

});

document.getElementById("modal")
.addEventListener("click", function(e) {

    if(e.target === this)
        this.style.display = "none";

});

</script>

</body>
</html>
