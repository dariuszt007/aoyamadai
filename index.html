<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

header{
padding:20px;
text-align:center;
}

h1{
margin-bottom:15px;
}

#search{
width:100%;
max-width:500px;
padding:12px;
font-size:16px;
border:none;
border-radius:8px;
}

.gallery{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:15px;
}

.gallery img{
width:100%;
height:250px;
object-fit:cover;
border-radius:10px;
cursor:pointer;
transition:.3s;
background:#222;
}

.gallery img:hover{
transform:scale(1.03);
}

.loading{
text-align:center;
padding:40px;
font-size:20px;
}

.modal{
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.95);
justify-content:center;
align-items:center;
overflow:hidden;
z-index:99999;
}

.viewer{
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

#fullImage{
max-width:none;
max-height:none;
cursor:grab;
transform-origin:center center;
}

.toolbar{
position:absolute;
top:15px;
left:15px;
display:flex;
gap:8px;
flex-wrap:wrap;
z-index:100000;
}

.toolbar button,
.download{
background:#222;
border:1px solid #666;
color:white;
padding:10px 14px;
border-radius:6px;
cursor:pointer;
text-decoration:none;
}

.toolbar button:hover,
.download:hover{
background:#444;
}

.close{
position:absolute;
right:20px;
top:10px;
font-size:40px;
cursor:pointer;
z-index:100001;
}

.filename{
position:absolute;
bottom:20px;
left:20px;
background:rgba(0,0,0,.6);
padding:10px;
border-radius:8px;
z-index:100001;
}

#zoomLevel{
display:flex;
align-items:center;
padding:0 10px;
}

</style>
</head>
<body>

<header>

<h1>Galeria Zdjęć</h1>

<input
id="search"
type="text"
placeholder="Szukaj zdjęcia...">

</header>

<div id="loading" class="loading">
Ładowanie zdjęć...
</div>

<div class="gallery" id="gallery"></div>

<div class="modal" id="modal">

<span class="close">&times;</span>

<div class="toolbar">

<button onclick="prevImage()">◀</button>

<button onclick="zoomOut()">−</button>

<button onclick="resetZoom()">100%</button>

<button onclick="zoomIn()">+</button>

<button onclick="nextImage()">▶</button>

<span id="zoomLevel">100%</span>

<a
id="downloadBtn"
class="download"
download>
Pobierz
</a>

</div>

<div class="viewer">

<img id="fullImage">

</div>

<div id="fileName" class="filename"></div>

</div>

<script>

const USER = "dariuszt007";
const REPO = "aoyamadai";
const BRANCH = "main";

const SUPPORTED = [
".jpg",
".jpeg",
".png",
".gif",
".webp",
".bmp",
".svg",
".avif"
];

const gallery =
document.getElementById("gallery");

const loading =
document.getElementById("loading");

const modal =
document.getElementById("modal");

const fullImage =
document.getElementById("fullImage");

const fileName =
document.getElementById("fileName");

const downloadBtn =
document.getElementById("downloadBtn");

let images = [];
let currentIndex = 0;

async function scanFolder(path){

const url =
`https://api.github.com/repos/${USER}/${REPO}/contents/${path}`;

try{

const response = await fetch(url);

if(!response.ok) return;

const items = await response.json();

for(const item of items){

if(item.type === "dir"){

await scanFolder(item.path);

}
else if(item.type === "file"){

const lower =
item.name.toLowerCase();

const isImage =
SUPPORTED.some(ext =>
lower.endsWith(ext));

if(isImage){

images.push(item);

addThumbnail(item);

}

}

}

}
catch(error){

console.error(error);

}

}

function addThumbnail(item){

const img =
document.createElement("img");

img.src =
`https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/${item.path}`;

img.dataset.name =
item.name.toLowerCase();

img.onclick = () => {

currentIndex =
images.findIndex(i =>
i.path === item.path);

openViewer(currentIndex);

};

gallery.appendChild(img);

}

function openViewer(index){

const item =
images[index];

currentIndex = index;

const imageUrl =
`https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/${item.path}`;

modal.style.display="flex";

fullImage.src=imageUrl;

downloadBtn.href=imageUrl;
downloadBtn.download=item.name;

fileName.textContent=item.path;

resetZoom();

}

function nextImage(){

if(images.length===0) return;

currentIndex++;

if(currentIndex>=images.length){

currentIndex=0;

}

openViewer(currentIndex);

}

function prevImage(){

if(images.length===0) return;

currentIndex--;

if(currentIndex<0){

currentIndex=
images.length-1;

}

openViewer(currentIndex);

}

scanFolder("images").then(()=>{

loading.style.display="none";

if(images.length===0){

gallery.innerHTML =
"<h2>Brak zdjęć</h2>";

}

});

document.querySelector(".close")
.onclick=()=>{

modal.style.display="none";

};

modal.onclick=(e)=>{

if(e.target===modal){

modal.style.display="none";

}

};

let zoom=1;
let posX=0;
let posY=0;

function updateTransform(){

fullImage.style.transform =
`translate(${posX}px,${posY}px) scale(${zoom})`;

document.getElementById("zoomLevel")
.textContent =
Math.round(zoom*100)+"%";

}

function zoomIn(){

zoom += 0.25;

if(zoom > 10)
zoom = 10;

updateTransform();

}

function zoomOut(){

zoom -= 0.25;

if(zoom < 0.2)
zoom = 0.2;

updateTransform();

}

function resetZoom(){

zoom = 1;

posX = 0;

posY = 0;

updateTransform();

}

fullImage.addEventListener(
"wheel",
function(e){

e.preventDefault();

if(e.deltaY < 0){

zoom += 0.1;

}else{

zoom -= 0.1;

}

if(zoom < 0.2)
zoom = 0.2;

if(zoom > 10)
zoom = 10;

updateTransform();

}
);

let dragging=false;
let startX=0;
let startY=0;

fullImage.addEventListener(
"mousedown",
e=>{

dragging=true;

startX=e.clientX-posX;
startY=e.clientY-posY;

fullImage.style.cursor=
"grabbing";

}
);

document.addEventListener(
"mousemove",
e=>{

if(!dragging) return;

posX=e.clientX-startX;
posY=e.clientY-startY;

updateTransform();

}
);

document.addEventListener(
"mouseup",
()=>{

dragging=false;

fullImage.style.cursor=
"grab";

}
);

document
.getElementById("search")
.addEventListener(
"input",
function(){

const value =
this.value.toLowerCase();

document
.querySelectorAll(".gallery img")
.forEach(img=>{

if(
img.dataset.name
.includes(value)
){

img.style.display="block";

}
else{

img.style.display="none";

}

});

}
);

document.addEventListener(
"keydown",
e=>{

if(modal.style.display==="flex"){

if(e.key==="ArrowRight")
nextImage();

if(e.key==="ArrowLeft")
prevImage();

if(e.key==="Escape")
modal.style.display="none";

}

}
);

</script>

</body>
</html>
