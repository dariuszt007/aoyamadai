<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria Zdjęć</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    text-align:center;
    padding:20px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:15px;
    padding:15px;
}

.gallery img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}

.gallery img:hover{
    transform:scale(1.03);
}

.loading{
    text-align:center;
    padding:40px;
    font-size:20px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    justify-content:center;
    align-items:center;
    z-index:99999;
    overflow:hidden;
}

.viewer{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

#fullImage{
    max-width:none;
    max-height:none;
    cursor:grab;
    transform-origin:center center;
}

.toolbar{
    position:absolute;
    left:15px;
    top:15px;
    z-index:100000;
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
}

.toolbar button{
    background:#222;
    color:white;
    border:1px solid #666;
    border-radius:6px;
    padding:10px 15px;
    cursor:pointer;
}

.toolbar button:hover{
    background:#444;
}

.download{
    background:#0a84ff;
    color:white;
    text-decoration:none;
    padding:10px 15px;
    border-radius:6px;
}

.download:hover{
    background:#006be0;
}

.close{
    position:absolute;
    right:20px;
    top:10px;
    font-size:42px;
    cursor:pointer;
    z-index:100001;
}

#zoomLevel{
    min-width:70px;
}

</style>
</head>
<body>

<header>
<h1>Galeria Zdjęć</h1>
</header>

<div id="loading" class="loading">
Ładowanie zdjęć...
</div>

<div id="gallery" class="gallery"></div>

<div class="modal" id="modal">

    <span class="close">&times;</span>

    <div class="toolbar">

        <button onclick="zoomOut()">−</button>

        <button onclick="resetZoom()">100%</button>

        <button onclick="zoomIn()">+</button>

        <span id="zoomLevel">100%</span>

        <a
           id="downloadBtn"
           class="download"
           download>
           Pobierz
        </a>

    </div>

    <div class="viewer">
        <img id="fullImage">
    </div>

</div>

<script>

const USER = "dariuszt007";
const REPO = "aoyamadai";
const BRANCH = "main";

const gallery = document.getElementById("gallery");
const loading = document.getElementById("loading");

const imageExtensions = [
".png",
".jpg",
".jpeg",
".gif",
".webp",
".bmp",
".svg",
".avif"
];

async function scanFolder(path){

    try{

        const response = await fetch(
        `https://api.github.com/repos/${USER}/${REPO}/contents/${path}`
        );

        if(!response.ok) return;

        const data = await response.json();

        for(const item of data){

            if(item.type === "dir"){

                await scanFolder(item.path);

            }

            if(item.type === "file"){

                const name =
                item.name.toLowerCase();

                const isImage =
                imageExtensions.some(ext =>
                name.endsWith(ext));

                if(isImage){

                    addImage(item.path);

                }

            }

        }

    }
    catch(error){

        console.error(error);

    }

}

function addImage(path){

    const img =
    document.createElement("img");

    img.loading = "lazy";

    img.src =
    `https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/${path}`;

    img.onclick = ()=>{

        modal.style.display = "flex";

        fullImage.src = img.src;

        downloadBtn.href = img.src;

        downloadBtn.download =
        path.split("/").pop();

        resetZoom();

    };

    gallery.appendChild(img);

}

scanFolder("images").then(()=>{

    loading.style.display="none";

});

const modal =
document.getElementById("modal");

const fullImage =
document.getElementById("fullImage");

const downloadBtn =
document.getElementById("downloadBtn");

document.querySelector(".close")
.addEventListener("click",()=>{

    modal.style.display="none";

});

modal.addEventListener("click",e=>{

    if(e.target === modal){

        modal.style.display="none";

    }

});

let zoom = 1;
let posX = 0;
let posY = 0;

function updateTransform(){

    fullImage.style.transform =
    `translate(${posX}px,${posY}px) scale(${zoom})`;

    document.getElementById("zoomLevel")
    .textContent =
    Math.round(zoom * 100) + "%";

}

function resetZoom(){

    zoom = 1;
    posX = 0;
    posY = 0;

    updateTransform();

}

function zoomIn(){

    zoom += 0.25;

    if(zoom > 10)
        zoom = 10;

    updateTransform();

}

function zoomOut(){

    zoom -= 0.25;

    if(zoom < 0.25)
        zoom = 0.25;

    updateTransform();

}

fullImage.addEventListener("wheel",e=>{

    e.preventDefault();

    if(e.deltaY < 0){

        zoom += 0.1;

    }else{

        zoom -= 0.1;

    }

    if(zoom < 0.25)
        zoom = 0.25;

    if(zoom > 10)
        zoom = 10;

    updateTransform();

});

let dragging = false;
let startX = 0;
let startY = 0;

fullImage.addEventListener("mousedown",e=>{

    dragging = true;

    startX = e.clientX - posX;
    startY = e.clientY - posY;

    fullImage.style.cursor = "grabbing";

});

document.addEventListener("mousemove",e=>{

    if(!dragging) return;

    posX = e.clientX - startX;
    posY = e.clientY - startY;

    updateTransform();

});

document.addEventListener("mouseup",()=>{

    dragging = false;

    fullImage.style.cursor = "grab";

});

document.addEventListener("contextmenu",
e=>e.preventDefault());

document.addEventListener("dragstart",
e=>e.preventDefault());

document.addEventListener("selectstart",
e=>e.preventDefault());

</script>

</body>
</html>
