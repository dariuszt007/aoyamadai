<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galeria zdjęć</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#111;
color:#fff;
}

header{
padding:20px;
text-align:center;
background:#1a1a1a;
position:sticky;
top:0;
z-index:100;
}

h1{
margin-bottom:15px;
}

#search{
width:100%;
max-width:500px;
padding:12px;
border:none;
border-radius:8px;
font-size:16px;
}

.folderSection{
padding:25px;
}

.folderTitle{
font-size:26px;
margin-bottom:15px;
padding-bottom:10px;
border-bottom:2px solid #333;
}

.folderCount{
font-size:15px;
color:#aaa;
margin-left:10px;
}

.folderGrid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:15px;
}

.photoCard{
background:#1c1c1c;
border-radius:10px;
overflow:hidden;
}

.photoCard img{
width:100%;
height:220px;
object-fit:cover;
cursor:pointer;
transition:.3s;
display:block;
}

.photoCard img:hover{
transform:scale(1.04);
}

.fileName{
padding:10px;
font-size:13px;
word-break:break-word;
}

.loading{
padding:50px;
text-align:center;
font-size:22px;
}

.modal{
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.95);
justify-content:center;
align-items:center;
overflow:hidden;
z-index:9999;
}

.viewer{
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

#fullImage{
max-width:none;
max-height:none;
cursor:grab;
user-select:none;
transform-origin:center center;
}

.toolbar{
position:absolute;
top:15px;
left:15px;
display:flex;
gap:8px;
flex-wrap:wrap;
z-index:10000;
}

.toolbar button,
.downloadBtn{
background:#222;
border:1px solid #666;
color:white;
padding:10px 14px;
cursor:pointer;
border-radius:8px;
text-decoration:none;
}

.toolbar button:hover,
.downloadBtn:hover{
background:#444;
}

.close{
position:absolute;
top:10px;
right:20px;
font-size:45px;
cursor:pointer;
z-index:10001;
}

.bottomInfo{
position:absolute;
bottom:15px;
left:15px;
background:rgba(0,0,0,.6);
padding:10px;
border-radius:8px;
max-width:90%;
word-break:break-word;
}

#zoomLevel{
display:flex;
align-items:center;
padding-left:10px;
padding-right:10px;
}

</style>
</head>
<body>

<header>

<h1>Galeria zdjęć</h1>

<input
id="search"
type="text"
placeholder="Szukaj zdjęcia lub folderu">

</header>

<div class="loading" id="loading">
Ładowanie zdjęć...
</div>

<div id="gallery"></div>

<div class="modal" id="modal">

<span class="close">&times;</span>

<div class="toolbar">

<button onclick="prevImage()">◀</button>

<button onclick="zoomOut()">−</button>

<button onclick="resetZoom()">100%</button>

<button onclick="zoomIn()">+</button>

<button onclick="nextImage()">▶</button>

<span id="zoomLevel">100%</span>

<a
id="downloadBtn"
class="downloadBtn"
download>
Pobierz
</a>

</div>

<div class="viewer">

<img id="fullImage">

</div>

<div id="imageInfo" class="bottomInfo"></div>

</div>

<script>

const USER = "dariuszt007";
const REPO = "aoyamadai";
const BRANCH = "main";

const SUPPORTED = [
".jpg",
".jpeg",
".png",
".gif",
".webp",
".bmp",
".svg",
".avif"
];

const folders = {};
const images = [];

const gallery =
document.getElementById("gallery");

const loading =
document.getElementById("loading");

async function scanFolder(path){

const url =
`https://api.github.com/repos/${USER}/${REPO}/contents/${path}`;

try{

const response = await fetch(url);

if(!response.ok) return;

const items = await response.json();

for(const item of items){

if(item.type==="dir"){

await scanFolder(item.path);

}
else if(item.type==="file"){

const lower =
item.name.toLowerCase();

const isImage =
SUPPORTED.some(ext =>
lower.endsWith(ext));

if(!isImage) continue;

const folder =
item.path.substring(
0,
item.path.lastIndexOf("/")
);

if(!folders[folder]){

folders[folder]=[];

}

folders[folder].push(item);

images.push(item);

}

}

}catch(e){

console.error(e);

}

}

function renderGallery(){

gallery.innerHTML="";

const keys =
Object.keys(folders)
.sort((a,b)=>
a.localeCompare(b));

keys.forEach(folder=>{

folders[folder]
.sort((a,b)=>
a.name.localeCompare(b.name));

const section =
document.createElement("div");

section.className =
"folderSection";

const title =
folder.replace("images/","");

section.innerHTML=
`
<div class="folderTitle">
📁 ${title}
<span class="folderCount">
(${folders[folder].length})
</span>
</div>
<div class="folderGrid"></div>
`;

const grid =
section.querySelector(".folderGrid");

folders[folder]
.forEach(item=>{

const card =
document.createElement("div");

card.className=
"photoCard";

const src =
`https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/${item.path}`;

card.innerHTML=
`
<img src="${src}" loading="lazy">
<div class="fileName">
${item.name}
</div>
`;

card.querySelector("img")
.onclick=()=>{

const idx =
images.findIndex(
img =>
img.path===item.path
);

openImage(idx);

};

grid.appendChild(card);

});

gallery.appendChild(section);

});

}

scanFolder("images")
.then(()=>{

loading.style.display="none";

renderGallery();

});

const modal =
document.getElementById("modal");

const fullImage =
document.getElementById("fullImage");

const imageInfo =
document.getElementById("imageInfo");

const downloadBtn =
document.getElementById("downloadBtn");

let currentIndex=0;

function openImage(index){

currentIndex=index;

const img=
images[index];

const src=
`https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/${img.path}`;

fullImage.src=src;

downloadBtn.href=src;
downloadBtn.download=img.name;

imageInfo.textContent=
img.path;

modal.style.display="flex";

resetZoom();

}

function nextImage(){

currentIndex++;

if(currentIndex>=images.length){

currentIndex=0;

}

openImage(currentIndex);

}

function prevImage(){

currentIndex--;

if(currentIndex<0){

currentIndex=
images.length-1;

}

openImage(currentIndex);

}

document.querySelector(".close")
.onclick=()=>{

modal.style.display="none";

};

modal.onclick=e=>{

if(e.target===modal){

modal.style.display="none";

}

};

let zoom=1;
let posX=0;
let posY=0;

function updateTransform(){

fullImage.style.transform=
`translate(${posX}px,${posY}px) scale(${zoom})`;

document.getElementById("zoomLevel")
.textContent=
Math.round(zoom*100)+"%";

}

function zoomIn(){

zoom+=0.25;

if(zoom>10) zoom=10;

updateTransform();

}

function zoomOut(){

zoom-=0.25;

if(zoom<0.2) zoom=0.2;

updateTransform();

}

function resetZoom(){

zoom=1;
posX=0;
posY=0;

updateTransform();

}

fullImage.addEventListener(
"wheel",
e=>{

e.preventDefault();

if(e.deltaY<0){

zoom+=0.1;

}else{

zoom-=0.1;

}

if(zoom<0.2) zoom=0.2;
if(zoom>10) zoom=10;

updateTransform();

}
);

let dragging=false;
let startX=0;
let startY=0;

fullImage.addEventListener(
"mousedown",
e=>{

dragging=true;

startX=e.clientX-posX;
startY=e.clientY-posY;

fullImage.style.cursor=
"grabbing";

}
);

document.addEventListener(
"mousemove",
e=>{

if(!dragging) return;

posX=e.clientX-startX;
posY=e.clientY-startY;

updateTransform();

}
);

document.addEventListener(
"mouseup",
()=>{

dragging=false;

fullImage.style.cursor=
"grab";

}
);

document
.getElementById("search")
.addEventListener(
"input",
function(){

const value=
this.value.toLowerCase();

document
.querySelectorAll(".folderSection")
.forEach(section=>{

let found=false;

section
.querySelectorAll(".photoCard")
.forEach(card=>{

const text=
card.textContent.toLowerCase();

if(text.includes(value)){

card.style.display="block";
found=true;

}else{

card.style.display="none";

}

});

section.style.display=
found ? "block" : "none";

});

}
);

document.addEventListener(
"keydown",
e=>{

if(modal.style.display!=="flex")
return;

if(e.key==="ArrowRight")
nextImage();

if(e.key==="ArrowLeft")
prevImage();

if(e.key==="Escape")
modal.style.display="none";

}
);

</script>

</body>
</html>
